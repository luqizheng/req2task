[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora = "0.2"
pingora-proxy = "0.2"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
pin-project-lite = "0.2"
tungstenite = "0.21"
tokio-tungstenite = "0.21"
reqwest = { version = "0.11", features = ["json"] }
nacos-sdk = "0.2"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
serde_yaml = "0.9"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
