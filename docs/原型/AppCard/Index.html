<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <link rel="stylesheet" href="css/font.css">
  <script src="js/animation.js"></script>
  <style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.Pixso-canvas-0_1 > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.Pixso-canvas-0_1 {
  width: 100%;
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.Pixso-frame-21_2 {
  width: 100%;
  height: 100%;
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: flex-start;
  padding: 24px 24px 24px 24px;
  background-color: rgba(255, 255, 255, 1);
}

.stroke-wrapper-21_2 {
  position: relative;
  width: 100%;
  height: 904px;
  display: flex;
  flex-shrink: 0;
}

.stroke-21_2 {
  position: absolute;
  inset: 0px;
  border-radius: 0px 0px 0px 0px;
  pointer-events: none;
  border-width: 0px 1px 0px 0px;
  border-style: solid;
  box-sizing: border-box;
  border-color: rgba(228, 228, 231, 1);
}

.Pixso-frame-21_3 {
  width: 100%;
  height: auto;
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  align-items: center;
}

.frame-content-21_3 {
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  width: 100%;
  position: relative;
}

.Pixso-vector-21_4 {
  width: 16px;
  height: 16px;
  background-image: url(./image/messagecircle.png);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  position: relative;
  flex-shrink: 0;
}

.Pixso-paragraph-21_6 {
  font-size: 16px;
  font-family: "Inter-Semi Bold";
  font-weight: Semi Bold;
  color: rgba(24, 24, 27, 1);
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  white-space: pre;
  flex-grow: 0;
}

.Pixso-frame-21_7 {
  width: 100%;
  height: 1px;
  position: relative;
  flex-shrink: 1;
  flex-grow: 1;
  flex-basis: 0;
}

.Pixso-frame-21_8 {
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  padding: 4px 8px 4px 8px;
  border-radius: 6px 6px 6px 6px;
  background-color: rgba(244, 244, 245, 1);
}

.Pixso-paragraph-21_9 {
  font-size: 12px;
  font-family: "Inter-Medium";
  font-weight: Medium;
  color: rgba(113, 113, 122, 1);
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  white-space: pre;
  flex-grow: 0;
}

.Pixso-paragraph-21_10 {
  font-size: 12px;
  font-family: "Inter-Medium";
  font-weight: Medium;
  color: rgba(161, 161, 170, 1);
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  white-space: pre;
  flex-grow: 0;
}

.Pixso-frame-21_11 {
  width: 100%;
  height: 4px;
  position: relative;
  flex-shrink: 0;
  border-radius: 2px 2px 2px 2px;
  background-color: rgba(244, 244, 245, 1);
}

.Pixso-frame-21_12 {
  width: 276px;
  height: 4px;
  position: absolute;
  left: 0px;
  top: 0px;
  border-radius: 2px 2px 2px 2px;
  background-color: rgba(37, 99, 235, 1);
}

.Pixso-frame-21_14 {
  width: 100%;
  height: 1px;
  position: relative;
  flex-shrink: 0;
  background-color: rgba(228, 228, 231, 1);
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div id="0_1" class="Pixso-canvas-0_1">
    <div id="21_2" class="stroke-wrapper-21_2">
      <div class="Pixso-frame-21_2">
        <div id="21_3" class="Pixso-frame-21_3">
          <div class="frame-content-21_3">
            <div id="21_4" class="Pixso-vector-21_4"></div>
            <p id="21_6" class="Pixso-paragraph-21_6">追问与澄清</p>
            <div id="21_7" class="Pixso-frame-21_7"></div>
            <div id="21_8" class="Pixso-frame-21_8">
              <p id="21_9" class="Pixso-paragraph-21_9">3 个问题</p>
            </div>
            <p id="21_10" class="Pixso-paragraph-21_10">步骤 2/3</p>
          </div>
        </div>
        <div id="21_11" class="Pixso-frame-21_11">
          <div id="21_12" class="Pixso-frame-21_12"></div>
        </div>
        <div id="21_14" class="Pixso-frame-21_14"></div>
      </div>
      <div class="stroke-21_2"></div>
    </div>
  </div>
</div>


<script>

</script>

</body>
</html>
