<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <link rel="stylesheet" href="css/font.css">
  <script src="js/animation.js"></script>
  <style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.Pixso-canvas-0_1 > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.Pixso-canvas-0_1 {
  width: 100%;
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.Pixso-frame-11_99 {
  width: 100%;
  height: 100%;
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: center;
  padding: 10px 12px 10px 12px;
  background-color: rgba(250, 250, 250, 1);
}

.stroke-wrapper-11_99 {
  position: relative;
  width: 100%;
  height: 53px;
  display: flex;
  flex-shrink: 0;
}

.stroke-11_99 {
  position: absolute;
  inset: 0px;
  border-radius: 0px 0px 0px 0px;
  pointer-events: none;
  border-width: 1px;
  border-style: solid;
  box-sizing: border-box;
  border-color: rgba(232, 232, 232, 1);
}

.Pixso-vector-11_100 {
  width: 18px;
  height: 18px;
  background-image: url(./image/file.png);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  position: relative;
  flex-shrink: 0;
}

.Pixso-frame-11_103 {
  width: 100%;
  height: auto;
  position: relative;
  flex-shrink: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  flex-grow: 1;
  flex-basis: 0;
  background-color: rgba(250, 250, 250, 0);
}

.frame-content-11_103 {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
  width: 100%;
  position: relative;
}

.Pixso-paragraph-11_104 {
  font-size: 13px;
  font-family: "Inter-Medium";
  font-weight: Medium;
  color: rgba(13, 13, 13, 1);
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  white-space: pre;
  flex-grow: 0;
}

.Pixso-paragraph-11_105 {
  font-size: 12px;
  font-family: "Inter-Regular";
  font-weight: Regular;
  color: rgba(176, 176, 176, 1);
  width: auto;
  height: auto;
  position: relative;
  flex-shrink: 0;
  white-space: pre;
  flex-grow: 0;
}

.Pixso-vector-11_106 {
  width: 14px;
  height: 14px;
  background-image: url(./image/download.png);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  position: relative;
  flex-shrink: 0;
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div id="0_1" class="Pixso-canvas-0_1">
    <div id="11_99" class="stroke-wrapper-11_99">
      <div class="Pixso-frame-11_99">
        <div id="11_100" class="Pixso-vector-11_100"></div>
        <div id="11_103" class="Pixso-frame-11_103">
          <div class="frame-content-11_103">
            <p id="11_104" class="Pixso-paragraph-11_104">用户访谈记录_20240315.pdf</p>
            <p id="11_105" class="Pixso-paragraph-11_105">2.4 MB · PDF</p>
          </div>
        </div>
        <div id="11_106" class="Pixso-vector-11_106"></div>
      </div>
      <div class="stroke-11_99"></div>
    </div>
  </div>
</div>


<script>

</script>

</body>
</html>
